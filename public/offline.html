<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1D4ED8">
    <title>Koneksi Terputus - Tokoku</title>
    <style>
        :root {
            --bg: #F4F6F9;
            --surface: #FFFFFF;
            --border: #DCE3EC;
            --ink: #0F172A;
            --muted: #475569;
            --accent: #1D4ED8;
            --accent-fg: #FFFFFF;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F172A;
                --surface: #1E293B;
                --border: #334155;
                --ink: #F8FAFC;
                --muted: #CBD5E1;
                --accent: #60A5FA;
                --accent-fg: #0F172A;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        .card {
            width: 100%;
            max-width: 26rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.75rem;
            text-align: center;
        }
        .mark {
            width: 3rem;
            height: 3rem;
            border-radius: 0.75rem;
            background: var(--accent);
            color: var(--accent-fg);
            font-weight: 700;
            font-size: 1.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem 0; }
        p { font-size: 0.92rem; color: var(--muted); margin: 0 0 1.5rem 0; }
        button {
            min-height: 2.75rem;
            padding: 0 1.25rem;
            border-radius: 0.6rem;
            border: none;
            background: var(--accent);
            color: var(--accent-fg);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">T</div>
        <h1>Koneksi Internet Sedang Terputus</h1>
        <p>Tokoku membutuhkan koneksi internet untuk menampilkan stok barang terbaru, harga part PC, dan status servis bengkel.</p>
        <button type="button" onclick="window.location.reload()">Coba Muat Ulang</button>
    </main>
</body>
</html>
